<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F1E1" />
    <meta name="description" content="Farm advice in English or Pidgin: photograph your crop, ask a question, check the weather." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>AgroAI Advisor</title>
    <!-- Critical CSS: keeps the page from flashing unstyled (and the skip link from showing) while the app loads. -->
    <style>
      html { background: #F7F1E1; }
      html[data-theme='dark'] { background: #0B1F18; color: #F7F1E1; }
      body { margin: 0; font-family: system-ui, sans-serif; }
      .skip-link { position: absolute; left: 1rem; top: -8rem; }
      .skip-link:focus { top: 1rem; }
      .boot { display: flex; min-height: 70vh; align-items: center; justify-content: center; }
      .boot img { width: 64px; height: 64px; animation: boot 1.6s ease-in-out infinite alternate; }
      @keyframes boot { from { opacity: .45; transform: scale(.94); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }

      /* Boot screen: a seedling grows out of the red soil, the sun comes up behind it, then the name settles in.
         Shown on the first visit of a session and on reload, never on in-app navigation. */
      #boot { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 1.1rem; background: #F7F1E1; color: #0F3D2E; transition: opacity .35s ease-out; }
      html[data-theme='dark'] #boot { background: #0B1F18; color: #F7F1E1; }
      #boot.leaving { opacity: 0; pointer-events: none; }
      html.booted #boot { display: none; }
      #boot svg { width: 132px; height: 132px; overflow: visible; }
      #boot .b-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      #boot .b-soil { stroke: #C8553D; stroke-width: 6; stroke-dasharray: 1; stroke-dashoffset: 1; animation: b-draw .6s ease-out .05s forwards; }
      #boot .b-stem { stroke: currentColor; stroke-width: 5; stroke-dasharray: 1; stroke-dashoffset: 1; animation: b-draw .5s ease-out .55s forwards; }
      #boot .b-sun { fill: #F2B532; opacity: 0; transform: translateY(16px); animation: b-rise .7s cubic-bezier(.34,1.3,.5,1) .3s forwards; }
      #boot .b-leaf { fill: #3BB273; stroke: currentColor; stroke-width: 3.5; stroke-linejoin: round; transform: scale(0);
        animation: b-pop .55s cubic-bezier(.34,1.3,.5,1) forwards; }
      #boot .b-l1 { transform-origin: 60px 64px; animation-delay: .95s; }
      #boot .b-l2 { transform-origin: 60px 58px; animation-delay: 1.1s; }
      #boot .b-word { margin: 0; font: 700 1.5rem/1.1 'Atkinson Hyperlegible', system-ui, sans-serif; opacity: 0;
        letter-spacing: .2em; animation: b-word .8s cubic-bezier(.2,.9,.25,1.1) 1.1s forwards; }
      #boot .b-word span { color: #11573A; }
      html[data-theme='dark'] #boot .b-word span { color: #78D6A0; }
      #boot .b-tag { margin: 0; font: 400 .95rem/1.3 'Atkinson Hyperlegible', system-ui, sans-serif; opacity: 0; animation: b-fade .6s ease-out 1.5s forwards; }
      @keyframes b-draw { to { stroke-dashoffset: 0; } }
      @keyframes b-rise { to { opacity: 1; transform: none; } }
      @keyframes b-pop { to { transform: scale(1); } }
      @keyframes b-word { to { opacity: 1; letter-spacing: .02em; } }
      @keyframes b-fade { to { opacity: .75; } }
      @media (prefers-reduced-motion: reduce) {
        #boot *, #boot { animation-duration: .001ms !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
      }
    </style>
    <!-- Apply saved theme, text size and motion choice before first paint so nothing flashes. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('agroai.settings') || '{}');
          var d = document.documentElement;
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          d.dataset.theme = s.theme || (dark ? 'dark' : 'light');
          if (s.textScale) d.style.setProperty('--text-scale', s.textScale);
          if (s.reduceMotion) d.dataset.motion = 'reduce';
          if (s.language === 'pcm') d.lang = 'en-NG';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading AgroAI Advisor">
      <svg viewBox="0 0 140 140" aria-hidden="true" focusable="false">
        <defs><clipPath id="boot-clip"><circle cx="70" cy="70" r="58"/></clipPath></defs>
        <circle class="e e-ring" pathLength="1" cx="70" cy="70" r="60"/>
        <g clip-path="url(#boot-clip)">
          <path class="e e-sun" pathLength="1" d="M36 92 A 34 34 0 0 1 104 92"/>
          <path class="e e-f e-f1" pathLength="1" d="M6 92 C 28 85 46 99 70 92 S 114 85 134 92"/>
          <path class="e e-f e-f2" pathLength="1" d="M6 104 C 28 97 46 111 70 104 S 114 97 134 104"/>
          <path class="e e-f e-f3" pathLength="1" d="M6 116 C 28 109 46 123 70 116 S 114 109 134 116"/>
        </g>
        <path class="e-fill" d="M70 78 C 57 78 49 69 49 56 C 62 56 70 65 70 78 Z"/>
        <path class="e-fill" d="M70 70 C 83 68 91 59 91 46 C 78 47 70 57 70 70 Z"/>
        <path class="e e-stem" pathLength="1" d="M70 92 V 52"/>
        <path class="e e-leaf" pathLength="1" d="M70 78 C 57 78 49 69 49 56 C 62 56 70 65 70 78 Z"/>
        <path class="e e-leaf" pathLength="1" d="M70 70 C 83 68 91 59 91 46 C 78 47 70 57 70 70 Z"/>
      </svg>
      <p class="b-word"><b>AgroAI</b> Advisor</p>
      <span class="b-rule" aria-hidden="true"></span>
      <p class="b-tag">Farm advice in English or Pidgin</p>
    </div>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
    <header id="site-header" class="sticky top-0 z-30 border-b border-line bg-bg/95 backdrop-blur"></header>
    <main id="main" tabindex="-1" class="min-h-[60dvh]"><div class="boot" role="status" aria-label="Loading"><img src="/icons/icon.svg" alt=""></div></main>
    <footer id="site-footer" class="border-t border-line"></footer>
    <noscript>
      <style>#boot { display: none !important; }</style>
      <p style="padding:2rem">AgroAI Advisor needs JavaScript to work. Please turn it on in your browser settings.</p>
    </noscript>
    <script>
      // Boot screen timing: stays at least ~1.9 s so the seedling can finish growing, then fades out when the first
      // page has rendered. Skipped on in-app navigation (already seen this session) unless the page was reloaded.
      (function () {
        var d = document.documentElement, boot = document.getElementById('boot'), t0 = Date.now(), MIN = 1900, left = false;
        var nav = window.performance && performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
        var seen = false;
        try { seen = sessionStorage.getItem('agroai.booted') === '1'; } catch (e) {}
        var show = !seen || (nav && nav.type === 'reload');
        try { sessionStorage.setItem('agroai.booted', '1'); } catch (e) {}
        if (!show && boot) { d.classList.add('booted'); }
        function ready() { document.dispatchEvent(new Event('app:ready')); }
        function leave() {
          if (left) return; left = true;
          if (!show || !boot) { d.classList.add('booted'); ready(); return; }
          setTimeout(function () {
            boot.classList.add('leaving');
            setTimeout(function () { d.classList.add('booted'); boot.remove(); ready(); }, 360);
          }, Math.max(0, MIN - (Date.now() - t0)));
        }
        document.addEventListener('route:rendered', leave, { once: true });
        setTimeout(leave, 9000); // never trap the user behind the boot screen
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
