<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AgroAI Advisor">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14503C"/>
      <stop offset="1" stop-color="#0B2A1F"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <!-- the sun comes up behind the sprout -->
    <circle cx="32" cy="41" r="18" fill="#F2B532"/>
    <circle cx="32" cy="41" r="18" fill="none" stroke="#FFD66B" stroke-width="1.5" opacity=".55"/>
    <!-- red soil: a single furrow line that also hides the lower sun -->
    <path d="M0 45 C 12 40.5 24 50 38 45.5 S 58 41.5 64 43.5 V 64 H 0 Z" fill="#C8553D"/>
    <path d="M0 52 C 14 47.5 26 57 40 52.5 S 58 49.5 64 51" fill="none" stroke="#9E3F2B" stroke-width="2" stroke-linecap="round" opacity=".8"/>
    <!-- sprout: stem and two leaves -->
    <path d="M32 47 V 27" stroke="#F7F1E1" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 37 C 23.5 36.5 18 31 18 22.5 C 26.5 22.5 32 28 32 37 Z" fill="#3BB273"/>
    <path d="M32 31 C 39.5 29.5 45 24 45 15.5 C 37 16.5 32 22 32 31 Z" fill="#52CE8D"/>
    <path d="M32 37 C 29 32.5 25 28.5 20 25.5" fill="none" stroke="#0F3D2E" stroke-width="1.2" stroke-linecap="round" opacity=".45"/>
  </g>
</svg>
